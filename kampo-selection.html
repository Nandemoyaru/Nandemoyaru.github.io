<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢方薬処方選択支援ツール</title>
    <style>
        :root {
            --primary: #2c5d3f;
            --primary-light: #e8f0ec;
            --secondary: #4a7c59;
            --accent: #d97724;
            --bg: #f8faf9;
            --card-bg: #ffffff;
            --text: #2b2b2b;
            --border: #dcdcdc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #666;
            margin: 0;
            font-size: 0.95rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--primary-light);
        }

        .section-group {
            margin-bottom: 20px;
        }

        .section-label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: var(--secondary);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            background: #f4f6f5;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: var(--primary-light);
        }

        .checkbox-item input {
            margin-right: 6px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .radio-item input {
            margin-right: 5px;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .btn-action:hover {
            background: var(--secondary);
        }

        .result-item {
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
        }

        .result-item.high-match {
            border-left-color: var(--accent);
            background: #fffdfa;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .kampo-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .match-rate {
            font-size: 0.85rem;
            font-weight: bold;
            background: var(--primary-light);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 12px;
        }

        .result-item.high-match .match-rate {
            background: #fce8d5;
            color: var(--accent);
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 8px 0;
        }

        .tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            background: #eee;
            color: #555;
        }

        .tag.sho {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .detail-row {
            font-size: 0.88rem;
            margin-bottom: 5px;
        }

        .detail-label {
            font-weight: bold;
            color: #555;
        }

        .caution-text {
            color: #c62828;
            font-size: 0.82rem;
            margin-top: 6px;
            background: #ffebee;
            padding: 6px;
            border-radius: 4px;
        }

        .placeholder-text {
            color: #888;
            text-align: center;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>漢方薬処方選択支援ツール</h1>
        <p class="subtitle">患者の主訴・症状および病態・体質（気血水・虚実）に基づく処方候補一覧</p>
    </header>

    <div class="main-content">
        <!-- 入力セクション -->
        <div class="card">
            <h2 class="card-title">1. 患者情報・所見の入力</h2>

            <!-- 虚実・体質 -->
            <div class="section-group">
                <span class="section-label">体質（虚実）</span>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="kyojitsu" value="虚証"> 虚証（体力低下・線が細い）</label>
                    <label class="radio-item"><input type="radio" name="kyojitsu" value="中間" checked> 中間証</label>
                    <label class="radio-item"><input type="radio" name="kyojitsu" value="実証"> 実証（体力充実・がっしり）</label>
                </div>
            </div>

            <!-- 熱寒 -->
            <div class="section-group">
                <span class="section-label">寒熱</span>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="kannetsu" value="寒" > 寒（冷え症・温まると改善）</label>
                    <label class="radio-item"><input type="radio" name="kannetsu" value="平" checked> 平/どちらでもない</label>
                    <label class="radio-item"><input type="radio" name="kannetsu" value="熱"> 熱（のぼせ・炎症・暑がり）</label>
                </div>
            </div>

            <!-- 主訴・領域 -->
            <div class="section-group">
                <span class="section-label">主な症状・病態領域</span>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="感冒・呼吸器"> 感冒・咳嗽</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="胃腸障害"> 胃腸障害・食欲不振</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="精神・神経症状"> 精神不安・不眠・不穏</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="婦人科系症状"> 月経不順・冷え症</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="疼痛・関節痛"> 頭痛・関節痛・腰痛</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="水滞・浮腫"> むくみ・めまい</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="皮膚症状"> 皮膚炎・痒み・湿疹</label>
                    <label class="checkbox-item"><input type="checkbox" class="symptom-check" value="泌尿器症状"> 頻尿・排尿障害</label>
                </div>
            </div>

            <!-- 気血水分析用の症状 -->
            <div class="section-group">
                <span class="section-label">細部症状・随伴所見（気血水判定用）</span>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="倦怠感"> 全身倦怠感</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="イライラ"> イライラ・怒りっぽい</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="動悸"> 動悸・不安感</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="皮膚乾燥"> 皮膚の乾燥・カサつき</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="肩こり"> 頑固な肩こり</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="頭重感"> 頭重感・吐き気</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="便秘"> 便秘傾向</label>
                    <label class="checkbox-item"><input type="checkbox" class="detail-check" value="下痢"> 軟便・下痢傾向</label>
                </div>
            </div>

            <button type="button" class="btn-action" onclick="analyzeAndRecommend()">処方候補の分析・抽出</button>
        </div>

        <!-- 出力セクション -->
        <div class="card">
            <h2 class="card-title">2. 推奨処方一覧・詳細情報</h2>
            <div id="resultsContainer">
                <div class="placeholder-text">
                    条件を選択し、「処方候補の分析・抽出」を押してください。
                </div>
            </div>
        </div>
    </div>
</div>

const kampoDatabase = [
    ...kampoDatabase_Part1,
    ...kampoDatabase_Part2,
    ...kampoDatabase_Part3,
    ...kampoDatabase_Part4,
    ...kampoDatabase_Part5,
    ...kampoDatabase_Part6,
    ...kampoDatabase_Part7,
    ...kampoDatabase_Part8
];

function analyzeAndRecommend() {
    const kyojitsuSelected = document.querySelector('input[name="kyojitsu"]:checked').value;
    const kannetsuSelected = document.querySelector('input[name="kannetsu"]:checked').value;

    const selectedSymptoms = Array.from(document.querySelectorAll('.symptom-check:checked')).map(cb => cb.value);
    const selectedDetails = Array.from(document.querySelectorAll('.detail-check:checked')).map(cb => cb.value);

    if (selectedSymptoms.length === 0 && selectedDetails.length === 0) {
        alert("主な症状または随伴所見を最低1つ選択してください。");
        return;
    }

    // スコアリング算出
    const scoredList = kampoDatabase.map(item => {
        let score = 0;

        // 虚実マッチ
        if (item.kyojitsu.includes(kyojitsuSelected)) {
            score += 15;
        }

        // 寒熱マッチ
        if (item.kannetsu === kannetsuSelected || item.kannetsu === "平" || kannetsuSelected === "平") {
            score += 10;
        }

        // 症状（主訴）マッチ
        item.targetSymptoms.forEach(sym => {
            if (selectedSymptoms.includes(sym)) {
                score += 25;
            }
        });

        // 随伴症状・詳細マッチ
        item.details.forEach(det => {
            if (selectedDetails.includes(det)) {
                score += 15;
            }
        });

        return { ...item, score };
    });

    // スコアが高い順にソート（15点超を抽出）
    const filteredList = scoredList.filter(item => item.score > 15).sort((a, b) => b.score - a.score);

    renderResults(filteredList);
}

function renderResults(results) {
    const container = document.getElementById("resultsContainer");
    container.innerHTML = "";

    if (results.length === 0) {
        container.innerHTML = `<div class="placeholder-text">該当する適応処方が見つかりませんでした。条件を変更して再検索してください。</div>`;
        return;
    }

    results.forEach((item, index) => {
        const isHigh = index === 0 || item.score >= 50;
        const div = document.createElement("div");
        div.className = `result-item ${isHigh ? 'high-match' : ''}`;

        div.innerHTML = `
            <div class="result-header">
                <span class="kampo-name">${item.id} ${item.name}</span>
                <span class="match-rate">適合スコア: ${item.score}</span>
            </div>
            <div class="tag-container">
                <span class="tag sho">証: ${item.sho}</span>
                <span class="tag">虚実: ${item.kyojitsu.join('・')}</span>
                <span class="tag">寒熱: ${item.kannetsu}</span>
            </div>
            <div class="detail-row"><span class="detail-label">主な効能・効果:</span> ${item.efficacy}</div>
            <div class="detail-row"><span class="detail-label">構成生薬:</span> ${item.composition}</div>
            <div class="caution-text"><strong>【使用上の注意】</strong> ${item.caution}</div>
        `;

        container.appendChild(div);
    });
}
